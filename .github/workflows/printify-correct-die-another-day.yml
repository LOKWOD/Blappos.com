name: Correct Die Another Day magnet artwork
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/printify-correct-die-another-day.yml
permissions:
  contents: read
concurrency:
  group: printify-product-creation
  cancel-in-progress: false
jobs:
  correct-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet Pillow
      - name: Replace existing magnet artwork
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: |
          python3 scripts/printify_sync.py \
            --shop-id 28900389 \
            --template-id 6aa39c2bae1c3c660b0c05f5 \
            --update-id 6abffa6316d623a3d20ffb80 \
            --story-id oct2-die-another-day \
            --title "Die Another Day" \
            --place "Nashville, Tennessee" \
            --image assets/cards/oct2-die-another-day.webp \
            --result /tmp/die-another-day-correction.json
