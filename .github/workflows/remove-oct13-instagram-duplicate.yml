name: Remove confirmed duplicate Instagram queue item
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-oct13-instagram-duplicate.yml']
permissions:
  contents: read
concurrency:
  group: buffer-x-queue
  cancel-in-progress: false
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove confirmed duplicate scheduled post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const api = 'https://api.buffer.com';
          const id = '6acf81bdd3e18071d3979d66';
          const query = `mutation DeletePost($input: DeletePostInput!) {
            deletePost(input: $input) {
              __typename
              ... on DeletePostSuccess { id }
              ... on MutationError { message }
            }
          }`;
          const response = await fetch(api, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.BUFFER_API_KEY}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({ query, variables: { input: { id } } }),
          });
          const body = await response.json();
          if (!response.ok || body.errors?.length) throw new Error(JSON.stringify(body.errors || body));
          if (body.data?.deletePost?.__typename !== 'DeletePostSuccess') {
            throw new Error(body.data?.deletePost?.message || body.data?.deletePost?.__typename || 'Unknown deletion result');
          }
          console.log(`REMOVED_CONFIRMED_DUPLICATE|${body.data.deletePost.id}`);
          NODE
