name: Deploy Blappos Likes to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Find or create D1 database
        id: d1
        working-directory: cloudflare/likes-worker
        run: |
          DB_ID=$(wrangler d1 list --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const rows=JSON.parse(s);
              const hit=rows.find(x=>x.name==='blappos-likes');
              if(hit) process.stdout.write(hit.uuid||hit.id||'');
            })")
          if [ -z "$DB_ID" ]; then
            OUT=$(wrangler d1 create blappos-likes)
            echo "$OUT"
            DB_ID=$(printf '%s' "$OUT" | sed -nE 's/.*database_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -1)
          fi
          test -n "$DB_ID" || (echo "Could not resolve D1 database id" && exit 1)
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build deploy config
        working-directory: cloudflare/likes-worker
        run: |
          cat > wrangler.deploy.toml <<EOF
          name = "blappos-likes"
          main = "src/index.js"
          compatibility_date = "2026-09-28"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          routes = [
            { pattern = "blappos.com/api/*", zone_name = "blappos.com" }
          ]

          [[d1_databases]]
          binding = "DB"
          database_name = "blappos-likes"
          database_id = "${{ steps.d1.outputs.db_id }}"
          EOF

      - name: Apply D1 schema
        working-directory: cloudflare/likes-worker
        run: wrangler d1 execute blappos-likes --remote --file=schema.sql --config wrangler.deploy.toml

      - name: Deploy likes Worker
        working-directory: cloudflare/likes-worker
        run: wrangler deploy --config wrangler.deploy.toml
