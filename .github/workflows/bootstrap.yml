name: Bootstrap Blappos source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore the Blappos source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .blappos-source.part-* | base64 --decode > /tmp/blappos-source.zip
          echo "b2a0b59147c810858b6fbed576c049037a6a79bd5cf53e3091a1247f35f83b0d  /tmp/blappos-source.zip" | sha256sum --check
          unzip -o /tmp/blappos-source.zip -d .
          rm -f .blappos-source.part-* .github/workflows/bootstrap.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: python scripts/build.py

      - name: Audit the site
        run: python scripts/check_site.py

      - name: Commit the editable first draft
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Blappos first draft"
          git push
