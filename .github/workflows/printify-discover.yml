name: Printify configuration check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/printify-discover.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read safe Printify configuration
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRINTIFY_API_TOKEN"
          shops=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $PRINTIFY_API_TOKEN" \
            "https://api.printify.com/v1/shops.json")
          shop_id=$(printf '%s' "$shops" | jq -r '.[] | select((.title | ascii_downcase) == "blappos") | .id' | head -1)
          if [ -z "$shop_id" ] || [ "$shop_id" = "null" ]; then
            echo "Blappos shop was not found."
            printf '%s' "$shops" | jq -r '.[] | "Available shop: id=\(.id) title=\(.title) channel=\(.sales_channel)"'
            exit 1
          fi
          echo "PRINTIFY_SHOP_ID=$shop_id"
          echo "PRINTIFY_SHOPS:"
          printf '%s' "$shops" | jq -r '.[] | "id=\(.id) title=\(.title) channel=\(.sales_channel)"'
          products=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $PRINTIFY_API_TOKEN" \
            "https://api.printify.com/v1/shops/$shop_id/products.json")
          echo "PRINTIFY_PRODUCTS:"
          printf '%s' "$products" | jq -r '.data[] | "id=\(.id) title=\(.title) blueprint=\(.blueprint_id) provider=\(.print_provider_id) visible=\(.visible) variants=\([.variants[] | select(.is_enabled) | .id] | join(","))"'
          printf '%s' "$products" | jq --argjson shop_id "$shop_id" '{shop_id:$shop_id,products:[.data[]|{id,title,blueprint_id,print_provider_id,visible,enabled_variant_ids:[.variants[]|select(.is_enabled)|.id]}]}' > printify-config.json
      - name: Save safe configuration
        run: |
          git config user.name "blappos-automation"
          git config user.email "actions@users.noreply.github.com"
          git add printify-config.json
          git commit -m "Record safe Printify product configuration"
          git push
