name: Reconstruct November 22 edition assets

on:
  push:
    branches: [main]
    paths:
      - .reconstruct/nov22/**
      - .github/workflows/reconstruct-nov22.yml

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify exact edition files
        run: |
          cat .reconstruct/nov22/daily-data.js.* > daily-data.js
          cat .reconstruct/nov22/nov22-bigfoot-files.jpg.* > assets/cards/nov22-bigfoot-files.jpg
          cat .reconstruct/nov22/nov22-cabin-cat.jpg.* > assets/cards/nov22-cabin-cat.jpg
          cat .reconstruct/nov22/nov22-jonathan-genome.jpg.* > assets/cards/nov22-jonathan-genome.jpg
          printf '%s  %s\n' \
            '7bd59f03e06dcaf3ecf8117b466ec1eaf2a4a27aeba811078ed2b9d71cca32a0' 'daily-data.js' \
            'e6b8598e90a13cc6fd4fe337d248f9a073aaf18d704c522a4df33371a3e35e69' 'assets/cards/nov22-bigfoot-files.jpg' \
            '0f1443ba4c56cbbfd68f4dc7c5290329b5d9f11fb84a8b0fe78c381259ed9e8e' 'assets/cards/nov22-cabin-cat.jpg' \
            'afeefba5f8b2805ba0e54bfe3b23150ce10b177539c9213123ea464fcb9d0959' 'assets/cards/nov22-jonathan-genome.jpg' | sha256sum --check --strict
          node --check daily-data.js
          rm -rf .reconstruct/nov22 .github/workflows/reconstruct-nov22.yml
      - name: Commit reconstructed edition
        run: |
          git config user.name "blappos-automation"
          git config user.email "actions@users.noreply.github.com"
          git add daily-data.js assets/cards/nov22-*.jpg .reconstruct/nov22 .github/workflows/reconstruct-nov22.yml
          git commit -m "Reconstruct November 22 edition assets"
          git push
