name: Discover Blappos merch catalog

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/printify_merch_discover.py
      - .github/workflows/printify-merch-discover.yml

permissions:
  contents: write

jobs:
  discover-merch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find safe catalog candidates
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: python3 scripts/printify_merch_discover.py
      - name: Save catalog shortlist
        run: |
          git config user.name "blappos-automation"
          git config user.email "actions@users.noreply.github.com"
          git add printify-merch-catalog.json
          git commit -m "Record Printify merch catalog shortlist"
          git push
