name: Build Blappos search pages and sitemap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - daily-data.js
      - archive-data.js
      - scripts/generate_search_assets.mjs
      - .github/workflows/search-assets.yml

permissions:
  contents: write

concurrency:
  group: blappos-search-assets
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate indexable story pages, sitemap, and robots file
        run: node scripts/generate_search_assets.mjs
      - name: Commit generated search assets
        run: |
          if git diff --quiet -- sitemap.xml robots.txt stories; then
            echo "Search assets are already current."
            exit 0
          fi
          git config user.name "blappos-automation"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml robots.txt stories
          git commit -m "Update Blappos search pages and sitemap"
          git push
