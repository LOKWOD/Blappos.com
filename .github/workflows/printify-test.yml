name: Test automated Blappos magnet

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: printify-product-creation
  cancel-in-progress: false

jobs:
  create-test-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Nicolas Cage sinkhole magnet
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: |
          python3 scripts/printify_sync.py \
            --shop-id 28900389 \
            --template-id 6aa39c2bae1c3c660b0c05f5 \
            --story-id sep9-nicolas-sinkhole \
            --title "Nicolas Cage’s driveway gets a basement it did not order" \
            --place "Malibu, California" \
            --image assets/cards/sep9-nicolas-sinkhole.png
      - name: Save safe test result
        run: |
          git config user.name "blappos-automation"
          git config user.email "actions@users.noreply.github.com"
          git add printify-test-result.json
          git commit -m "Record automated Printify test product"
          git push
