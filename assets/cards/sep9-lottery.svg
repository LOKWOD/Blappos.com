dth="8"/></g></g><text x="500" y="120" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="70" fill="#202a2c">MARYLAND</text><text x="500" y="196" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="40" fill="#b93e2d">STUBBORNNESS PAYS $150,000</text><rect x="154" y="840" width="692" height="78" rx="14" fill="#202a2c"/><text x="500" y="891" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="29" fill="#fff4da">3 TICKETS · 20 YEARS · FINALLY</text><text x="70" y="946" font-family="Arial Black,sans-serif" font-size="28" fill="#202a2c">BLAPPOS!</text></svg>